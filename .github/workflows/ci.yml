name: CI

on:
  push:
    branches:
      - '2.*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  testsuite:
    runs-on: ubuntu-latest
    name: PHP/Unit ${{ matrix.php }}/${{ matrix.phpunit }}
    env:
      extensions: intl, pcov, xml
      key: cache-v1 # can be any string, change to clear the extension cache.

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
        phpunit:
          - '8.5'
          - '9.3'
          - '10.0'
          - '11.0'
          - '12.0'
          - '13.0'
        include:
          - composer-options: "--ignore-platform-reqs"

        exclude:
          - php: '8.1'
            phpunit: '11.0'
          - php: '8.1'
            phpunit: '12.0'
          - php: '8.1'
            phpunit: '13.0'
          - php: '8.2'
            phpunit: '8.5'
          - php: '8.2'
            phpunit: '9.3'
          - php: '8.2'
            phpunit: '12.0'
          - php: '8.2'
            phpunit: '13.0'
          - php: '8.3'
            phpunit: '8.5'
          - php: '8.3'
            phpunit: '9.3'
          - php: '8.3'
            phpunit: '13.0'
          - php: '8.4'
            phpunit: '8.5'
          - php: '8.4'
            phpunit: '9.3'
          - php: '8.4'
            phpunit: '10.0'
          - php: '8.5'
            phpunit: '8.5'
          - php: '8.5'
            phpunit: '9.3'
          - php: '8.5'
            phpunit: '10.0'
          - php: '8.5'
            phpunit: '11.0'
          - php: '8.6'
            phpunit: '8.5'
          - php: '8.6'
            phpunit: '9.3'
          - php: '8.6'
            phpunit: '10.0'
          - php: '8.6'
            phpunit: '11.0'

    steps:
    - uses: actions/checkout@v6

    - name: Setup cache environment
      id: extcache
      uses: shivammathur/cache-extensions@v1
      with:
        php-version: ${{ matrix.php }}
        extensions: ${{ env.extensions }}
        key: ${{ env.key }}

    - name: Cache extensions
      uses: actions/cache@v6
      with:
        path: ${{ steps.extcache.outputs.dir }}
        key: ${{ steps.extcache.outputs.key }}
        restore-keys: ${{ steps.extcache.outputs.key }}

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: ${{ env.extensions }}
        tools: composer:v2
        coverage: none

    - name: Composer install
      run: composer update --no-interaction --no-progress
      env:
        COMPOSER_NO_SECURITY_BLOCKING: 1

    - name: Composer Set phpunit version
      run: composer update phpunit/phpunit:^${{ matrix.phpunit }} --with-dependencies --no-interaction --no-progress
      env:
        COMPOSER_NO_SECURITY_BLOCKING: 1

    - name: Run PHPUnit
      env:
        XDEBUG_MODE: coverage
      run: |
        vendor/bin/phpunit
